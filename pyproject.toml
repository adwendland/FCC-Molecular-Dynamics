[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "pybind11>=2.11",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["md"]
omit = [
    "md/plotting.py",
    "md/plot_analysis.py",
    "md/viz.py",
    "md/performance/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true